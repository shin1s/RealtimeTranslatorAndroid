name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip and build
        run: |
          rm -rf project
          mkdir project
          unzip -q RealtimeTranslator-Android-FINAL-v3.zip -d project
          P=$(dirname "$(find project -name settings.gradle.kts -type f -print -quit)")
          cd "$P"
          gradle --no-daemon assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/app-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: realtime-translator-debug-apk
          path: out/app-debug.apk
          if-no-files-found: error
